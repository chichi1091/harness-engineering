name: Quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Test and validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mechanical verification
        run: npm run verify

      - name: Validate quality gates declaration
        run: npm run validate:gates

      - name: Check pull request diff
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

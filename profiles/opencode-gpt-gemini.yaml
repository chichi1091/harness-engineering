name: opencode-gpt-gemini
model_tiers:
  economy:
    provider: google
    model: gemini-flash
  standard:
    provider: openai
    model: gpt-5.6-terra
  premium:
    provider: google
    model: gemini-pro
assignments:
  architect:
    tier: premium
    mode: readonly
  explorer:
    tier: economy
    mode: readonly
  developer:
    tier: standard
    mode: write
  test-engineer:
    tier: standard
    mode: write
  reviewer:
    tier: premium
    mode: readonly
model_policy:
  escalation:
    - when: critical_and_low_confidence
      tier: premium
    - when: low_confidence
      tier: standard
  max_escalations: 2

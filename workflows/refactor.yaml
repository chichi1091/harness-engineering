name: refactor
purpose: 外部仕様を維持しながら、保守性を改善する
entry_command: commands/refactor.md
routing:
  intents:
    - refactor
  required_request_fields:
    - target
    - goal
  priority: 100
steps:
  - id: design
    agent: agents/architect.yaml
    input:
      - 対象
      - 改善目標
    output:
      - artifact: design-result
        summary: リファクタリング方針
      - 仕様維持の受入条件
      - Explorer への調査依頼
    gate: 変更対象と仕様維持条件が明確である
  - id: explore
    agent: agents/explorer.yaml
    input:
      - リファクタリング方針
      - 調査依頼
    output:
      - artifact: exploration-result
        summary: 調査報告
      - 影響範囲
    gate: 依存関係と回帰リスクが根拠付きで示されている
  - id: implement
    agent: agents/developer.yaml
    input:
      - リファクタリング方針
      - 仕様維持の受入条件
      - 調査報告
    output:
      - artifact: implementation-result
        summary: 実装結果
      - 変更概要
    gate: 改善目標を満たし、外部仕様を変更していない
  - id: test
    agent: agents/test-engineer.yaml
    input:
      - 仕様維持の受入条件
      - artifact: implementation-result
        summary: 実装結果
      - 変更概要
    output:
      - artifact: test-result
        summary: テスト結果
      - 未検証領域
    gate: 仕様維持と回帰リスクの検証結果が記録されている
    on_failure: implement
    retry_policy:
      max_attempts: 2
  - id: review
    agent: agents/reviewer.yaml
    input:
      - リファクタリング方針
      - artifact: implementation-result
        summary: 実装結果
      - artifact: test-result
        summary: テスト結果
    output:
      - artifact: review-result
        summary: レビュー結果
      - 承認または差し戻し判断
    gate: 保守性の改善と仕様維持が承認されている
    on_failure: implement
    retry_policy:
      max_attempts: 2
      retry_on:
        - blocker
        - high
  - id: document
    agent: agents/documentation.yaml
    input:
      - 実装結果
      - レビュー結果
      - 変更概要
    output:
      - 更新済み文書
    gate: 必要な文書更新が完了している
completion:
  - 改善内容、仕様維持の証拠、レビュー結果が記録されている

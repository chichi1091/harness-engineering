name: design
purpose: 実装前に設計方針と受入条件を確立し、レビューする
entry_command: commands/design.md
routing:
  intents:
    - design
  required_request_fields:
    - goal
  priority: 100
steps:
  - id: design
    agent: agents/architect.yaml
    input:
      - 利用者の目的
      - 制約
    output:
      - 設計メモ
      - 受入条件
      - Explorer への調査依頼
    gate: 設計方針と受入条件が検証可能である
  - id: explore
    agent: agents/explorer.yaml
    input:
      - 設計メモ
      - 調査依頼
    output:
      - 調査報告
      - 影響範囲
    gate: 既存実装との整合性が根拠付きで示されている
  - id: review
    agent: agents/reviewer.yaml
    input:
      - 設計メモ
      - 受入条件
      - 調査報告
    output:
      - 設計レビュー結果
      - 承認または差し戻し判断
    gate: 設計が承認されている
    on_failure: design
  - id: document
    agent: agents/documentation.yaml
    input:
      - 設計メモ
      - 設計レビュー結果
    output:
      - 更新済み設計文書
    gate: 設計判断が文書化されている
completion:
  - 設計、調査、レビュー、文書化の成果物がそろっている

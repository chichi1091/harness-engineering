name: feature-development
purpose: 新機能を設計から文書化まで一貫して届ける
entry_command: commands/feature.md
routing:
  intents:
    - feature
  required_request_fields:
    - goal
  priority: 100
  risk:
    - medium
    - high
budget:
  max_total_tokens: 80000
  on_budget_exceeded:
    action: stop
    output:
      - completed_work
      - remaining_work
      - unresolved
steps:
  - id: design
    agent: agents/architect.yaml
    token_budget: 10000
    input:
      - 利用者の依頼
    output:
      - artifact: design-result
        summary: 設計メモ
      - 受入条件
      - 調査依頼
    gate: 実装対象と受入条件が明確である
  - id: explore
    agent: agents/explorer.yaml
    token_budget: 10000
    input:
      - 設計メモ
      - 調査依頼
    output:
      - artifact: exploration-result
        summary: 調査報告
      - 影響範囲
    gate: 変更箇所とリスクが根拠付きで示されている
  - id: implement
    agent: agents/developer.yaml
    token_budget: 40000
    input:
      - 設計メモ
      - 受入条件
      - 調査報告
    output:
      - artifact: implementation-result
        summary: 実装結果
      - 変更概要
    gate: 受入条件に対応する実装がある
  - id: test
    agent: agents/test-engineer.yaml
    token_budget: 10000
    input:
      - 受入条件
      - artifact: implementation-result
        summary: 実装結果
      - 変更概要
    output:
      - artifact: test-result
        summary: テスト結果
      - 未検証領域
    gate: 受入条件の検証結果が記録されている
    on_failure: implement
    retry_policy:
      max_attempts: 2
  - id: review
    agent: agents/reviewer.yaml
    token_budget: 15000
    input:
      - 設計メモ
      - artifact: implementation-result
        summary: 実装結果
      - artifact: test-result
        summary: テスト結果
    output:
      - artifact: review-result
        summary: レビュー結果
      - 判断
    gate: 承認されている
    on_failure: implement
    retry_policy:
      max_attempts: 2
      retry_on:
        - blocker
        - high
  - id: document
    agent: agents/documentation.yaml
    token_budget: 5000
    input:
      - 実装結果
      - レビュー結果
      - 変更概要
    output:
      - 更新済み文書
      - 文書更新概要
    gate: 必要な文書更新が完了している
completion:
  - 実装、テスト、レビュー、文書化の成果物がそろっている

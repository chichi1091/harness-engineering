name: lightweight-change
purpose: 軽微な変更を最小工程で安全に届ける
entry_command: commands/lightweight.md
routing:
  intents:
    - feature
    - bug-fix
  required_request_fields:
    - goal
  priority: 100
  risk:
    - low
budget:
  max_total_tokens: 15000
  on_budget_exceeded:
    action: stop
    output:
      - completed_work
      - remaining_work
      - unresolved
steps:
  - id: implement
    agent: agents/developer.yaml
    token_budget: 10000
    input:
      - 依頼内容
      - 変更箇所の特定情報
    output:
      - artifact: implementation-result
        summary: 実装結果
      - 変更概要
    gate: 意図した変更が最小範囲で行われている
  - id: test
    agent: agents/test-engineer.yaml
    token_budget: 5000
    input:
      - 依頼内容
      - artifact: implementation-result
        summary: 実装結果
      - 変更概要
    output:
      - artifact: test-result
        summary: テスト結果
      - 未検証領域
    gate: 変更に関する検証結果が記録されている
    on_failure: implement
    retry_policy:
      max_attempts: 2
completion:
  - 実装と検証の成果物がそろっている
  - 影響が軽微である根拠が記録されている
  - 未解決事項が明記されている
